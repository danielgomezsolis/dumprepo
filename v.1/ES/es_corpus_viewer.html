  const s=[...spans].sort((a,b)=>a.s-b.s); let out='', p=0;
  for(const x of s){ if(x.s<p) continue;
    out+=esc(text.slice(p,x.s));

}
let cur=0;
function show(i){
  cur=i; const d=D.docs[i];
  document.querySelectorAll('.item').forEach(el=>el.classList.toggle('on', +el.dataset.i===i));
  document.getElementById('en').innerHTML=render(d.en,d.en_spans);
  document.getElementById('es').innerHTML=render(d.es,d.es_spans);
  document.getElementById('sj').innerHTML=d.subjects.map(s=>`
   <div class="d"><b>Sujeto ${s.id}</b> — ${esc(s.desc)}</div>
   <table><tr><th>tag</th><th>keyword</th><th>certainty</th><th>hardness</th></tr>
   ${s.piis.map(p=>`<tr><td>${p.tag}</td><td class="kw">${esc(p.kw)}</td><td>${p.c}</td><td>${p.h}</td></tr>`).join('')}</table>`).join('');
  document.getElementById('sp').innerHTML=`<table>
   <tr><th>tipo</th><th>id</th><th>EN</th><th>ES</th><th>offset ES</th><th>literal</th></tr>
   ${d.es_spans.map((x,j)=>`<tr><td><b class="${x.t}">${x.t}</b> <span class="sub">${x.i}</span></td>
     <td class="kw">${x.sid}</td><td class="kw">${esc(d.en_spans[j]?d.en_spans[j].txt:'')}</td>
     <td class="kw">${esc(x.txt)}</td><td>${x.s}–${x.e}</td><td>${x.vb?'sí':''}</td></tr>`).join('')}</table>
   <div class="flags"><span class="pill">ratio ES/EN ${d.ratio??'—'}</span>
   <span class="pill${d.adj?' warn':''}">pares adyacentes: ${d.adj??0}</span>
   <span class="pill${d.dem_verbatim?' warn':''}">DEM literal: ${d.dem_verbatim}</span>
   <span class="pill">anotador: ${d.annotator??'—'}</span>
   ${d.echo?'<span class="pill warn">eco de prompt corregido</span>':''}</div>`;
}
function build(filter){
  const f=(filter||'').toLowerCase();
  const items=D.docs.map((d,i)=>({d,i})).filter(({d})=> !f ||
   d.id.toLowerCase().includes(f)||d.en.toLowerCase().includes(f)||d.es.toLowerCase().includes(f)||
   d.subjects.some(s=>s.piis.some(p=>p.kw.toLowerCase().includes(f))));
  document.getElementById('items').innerHTML=items.map(({d,i})=>
   `<div class="item" data-i="${i}"><div class="id">${d.id}</div>
    <div class="sub">${d.subjects.length} sujeto(s) · ${d.es_spans.length} spans${d.dem_verbatim?' · DEM literal':''}</div></div>`).join('');
  document.querySelectorAll('.item').forEach(el=>el.onclick=()=>show(+el.dataset.i));
  if(items.length) show(items[0].i);
}
document.getElementById('q').oninput=e=>build(e.target.value);
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
 if(e.key==='ArrowDown'){show(Math.min(cur+1,D.docs.length-1));e.preventDefault();}
 if(e.key==='ArrowUp'){show(Math.max(cur-1,0));e.preventDefault();}});
build('');
</script></body></html>
