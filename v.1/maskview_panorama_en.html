function renderOriginal(d){
  const masked=new Set(d.conds[focus].ph.map(p=>p[3]));
  const sp=[...d.spans].sort((a,b)=>a.s-b.s); let out='',p=0;
  for(const x of sp){ if(x.s<p) continue;
    out+=esc(d.text.slice(p,x.s));
    const kept = x.i!=='NO_MASK' && !masked.has(x.sid);
    out+=`<mark class="${x.t} ${x.i} ${kept?'kept':''}" title="${x.t} · ${x.i}${x.cs&&x.cs!=='NOT_CONFIDENTIAL'?' · '+x.cs:''} · ${masked.has(x.sid)?'masked':'left'}">${esc(d.text.slice(x.s,x.e))}</mark>`;

  return out+esc(d.text.slice(p));
}
function renderMasked(d,c){
  const ph=[...d.conds[c].ph].sort((a,b)=>a[0]-b[0]); let out='',p=0;
  for(const [s,e,lab] of ph){ if(s<p) continue;

}

}
function build(){
  const f=(document.getElementById('q').value||'').toLowerCase();
  const list=D.docs.map((d,i)=>({d,i})).filter(({d})=>!f||d.id.toLowerCase().includes(f)||
    d.text.toLowerCase().includes(f)||d.subjects.some(u=>u.piis.some(p=>p.kw.toLowerCase().includes(f))));
  document.getElementById('items').innerHTML=list.map(({d,i})=>
   `<div class="item" data-i="${i}"><div class="id">${d.id}</div>
    <div class="sub">${d.applicant?esc(d.applicant)+' · ':''}${d.spans.length} spans · ${d.subjects.length} subj</div>
    <div class="sub">verbatim: ${d.conds.full.leaks} / ${d.conds.partial070.leaks} / ${d.conds.direct_only.leaks}</div></div>`).join('');
  document.querySelectorAll('.item').forEach(el=>el.onclick=()=>show(+el.dataset.i));
  if(list.length) show(list[0].i);
}
document.getElementById('q').oninput=build;
document.querySelectorAll('#opts input[data-c]').forEach(cb=>cb.onchange=()=>{
  cb.checked?show_.add(cb.dataset.c):show_.delete(cb.dataset.c); show(cur);});
document.querySelectorAll('#opts input[name=f]').forEach(r=>r.onchange=()=>{focus=r.value; show(cur);});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
 if(e.key==='ArrowDown'){show(Math.min(cur+1,D.docs.length-1));e.preventDefault();}
 if(e.key==='ArrowUp'){show(Math.max(cur-1,0));e.preventDefault();}});
build();
</script></body></html>
